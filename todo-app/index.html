<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="todo-wrapper">
      <header class="header">
        <h1>✓ My Tasks</h1>
        <p class="subtitle">Stay organized and productive</p>
      </header>

      <div class="input-section">
        <div class="input-group">
          <input 
            type="text" 
            id="todoInput" 
            class="todo-input" 
            placeholder="Add a new task..."
            autocomplete="off"
          >
          <button id="addBtn" class="add-btn">Add</button>
        </div>
        <div class="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat-item">
          <span class="stat-label">Total:</span>
          <span id="totalCount" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Completed:</span>
          <span id="completedCount" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Remaining:</span>
          <span id="remainingCount" class="stat-value">0</span>
        </div>
      </div>

      <ul id="todoList" class="todo-list">
        <!-- Todos will be dynamically added here -->
      </ul>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">📝</div>
        <p>No tasks yet. Add one to get started!</p>
      </div>

      <div class="action-buttons">
        <button id="clearCompletedBtn" class="clear-btn" disabled>Clear Completed</button>
        <button id="clearAllBtn" class="clear-all-btn" disabled>Clear All</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
